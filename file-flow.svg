<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">gVisor POC repository file map</title>
  <desc id="desc">The repository's shell runners coordinate Docker image building, workloads, shared validation, seccomp profiles, and saved results. Documentation describes the project and conclusions.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #53657d; }
      .head { font-size: 18px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; }
      .body { font-size: 13px; fill: #40536c; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #334860; }
      .panel { fill: #fff; stroke: #c8d5e4; stroke-width: 1.5; }
      .runner { fill: #edf3fb; stroke: #91a9c4; stroke-width: 1.5; }
      .work { fill: #f3efff; stroke: #9c8bd2; stroke-width: 1.5; }
      .result { fill: #eaf7f3; stroke: #83c7b6; stroke-width: 1.5; }
      .doc { fill: #fff8e9; stroke: #dfc579; stroke-width: 1.5; }
      .line { fill: none; stroke: #657991; stroke-width: 2; marker-end: url(#arrow); }
      .softline { fill: none; stroke: #8294aa; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#657991"/></marker>
  </defs>
  <rect width="1600" height="1120" fill="#f4f7fb"/>
  <text x="48" y="58" class="title">How the POC files work together</text>
  <text x="50" y="87" class="subtitle">Runners are entry points; shared workload and validation code produces evidence under results/.</text>

  <!-- Repo tree -->
  <rect x="40" y="122" width="370" height="950" rx="16" class="panel"/>
  <text x="68" y="160" class="head">Repository map</text>
  <text x="70" y="204" class="mono">sandboxing/gvisor-poc/</text>
  <text x="92" y="238" class="mono">├── README.md · REPORT.md</text>
  <text x="92" y="266" class="mono">├── architecture.svg</text>
  <text x="92" y="294" class="mono">├── file-flow.svg</text>
  <text x="92" y="322" class="mono">├── Dockerfile · .dockerignore</text>
  <text x="92" y="350" class="mono">├── workload.py</text>
  <text x="92" y="378" class="mono">├── safety_validation.py</text>
  <text x="92" y="406" class="mono">├── allowlist_proxy.py</text>
  <text x="92" y="434" class="mono">├── install_gvisor.sh</text>
  <text x="92" y="462" class="mono">├── run_experiments.sh</text>
  <text x="92" y="490" class="mono">├── run_safety_checks.sh</text>
  <text x="92" y="518" class="mono">├── run_network_allowlist.sh</text>
  <text x="92" y="546" class="mono">├── run_negative_controls.sh</text>
  <text x="92" y="574" class="mono">├── run_syscall_matrix.sh</text>
  <text x="92" y="602" class="mono">├── generate_syscall_probe_profile.py</text>
  <text x="92" y="630" class="mono">├── profiles/</text>
  <text x="112" y="658" class="mono">│   ├── Docker default (pinned)</text>
  <text x="112" y="686" class="mono">│   ├── probe overlay + metadata</text>
  <text x="92" y="714" class="mono">└── results/</text>
  <text x="112" y="742" class="mono">    ├── benchmark runs</text>
  <text x="112" y="770" class="mono">    ├── safety / network evidence</text>
  <text x="112" y="798" class="mono">    ├── negative-control evidence</text>
  <text x="112" y="826" class="mono">    └── syscall matrix evidence</text>

  <rect x="68" y="870" width="314" height="156" rx="12" class="doc"/>
  <text x="88" y="902" class="label">Docs and supporting assets</text>
  <text x="88" y="931" class="body">README: setup, commands, file guide</text>
  <text x="88" y="956" class="body">REPORT: findings and limitations</text>
  <text x="88" y="981" class="body">SVGs: runtime architecture and this map</text>
  <text x="88" y="1006" class="body">profiles/README: provenance and purpose</text>

  <!-- workflow lanes -->
  <rect x="450" y="122" width="1110" height="208" rx="16" class="runner"/>
  <text x="480" y="160" class="head">1 · Prepare the VM and runtime</text>
  <rect x="490" y="190" width="250" height="100" rx="12" class="panel"/>
  <text x="510" y="222" class="label">install_gvisor.sh</text>
  <text x="510" y="249" class="body">Installs/registers runsc</text>
  <text x="510" y="272" class="body">inside the Linux VM</text>
  <rect x="805" y="190" width="250" height="100" rx="12" class="panel"/>
  <text x="825" y="222" class="label">Dockerfile</text>
  <text x="825" y="249" class="body">Builds pinned Python image</text>
  <text x="825" y="272" class="body">.dockerignore limits build context</text>
  <rect x="1120" y="190" width="390" height="100" rx="12" class="doc"/>
  <text x="1140" y="222" class="label">README.md</text>
  <text x="1140" y="249" class="body">Documents copy-to-VM and runner commands</text>
  <text x="1140" y="272" class="body">No host home directory is mounted</text>
  <path d="M740 240 H795" class="line"/>

  <rect x="450" y="362" width="1110" height="190" rx="16" class="runner"/>
  <text x="480" y="400" class="head">2 · Run a test lane</text>
  <rect x="490" y="428" width="280" height="96" rx="12" class="panel"/>
  <text x="510" y="458" class="label">run_experiments.sh</text>
  <text x="510" y="484" class="body">Paired runtime timing trials</text>
  <text x="510" y="506" class="body">Uses Dockerfile + workload.py</text>
  <rect x="805" y="428" width="330" height="96" rx="12" class="panel"/>
  <text x="825" y="458" class="label">Safety / network / negative controls</text>
  <text x="825" y="484" class="body">run_safety_checks.sh · run_network_allowlist.sh</text>
  <text x="825" y="506" class="body">run_negative_controls.sh</text>
  <rect x="1170" y="428" width="340" height="96" rx="12" class="work"/>
  <text x="1190" y="458" class="label">Shared workload and validation</text>
  <text x="1190" y="484" class="body">workload.py · safety_validation.py</text>
  <text x="1190" y="506" class="body">allowlist_proxy.py for HTTPS policy lane</text>
  <path d="M770 476 H795" class="line"/>
  <path d="M1135 476 H1160" class="line"/>

  <rect x="450" y="584" width="1110" height="220" rx="16" class="runner"/>
  <text x="480" y="622" class="head">3 · Probe syscall policy (separate from benchmarks)</text>
  <rect x="490" y="650" width="300" height="112" rx="12" class="panel"/>
  <text x="510" y="682" class="label">run_syscall_matrix.sh</text>
  <text x="510" y="710" class="body">Runs both runtimes / seccomp modes</text>
  <text x="510" y="733" class="body">Records probe + policy evidence</text>
  <rect x="825" y="650" width="315" height="112" rx="12" class="work"/>
  <text x="845" y="682" class="label">Profile generator + profiles/</text>
  <text x="845" y="710" class="body">Hash-checks pinned Docker profile</text>
  <text x="845" y="733" class="body">Creates probe-only overlay</text>
  <rect x="1175" y="650" width="335" height="112" rx="12" class="panel"/>
  <text x="1195" y="682" class="label">Optional runsc trace</text>
  <text x="1195" y="710" class="body">Dedicated debug runtime + --strace</text>
  <text x="1195" y="733" class="body">Extra logs; not performance data</text>
  <path d="M790 706 H815" class="line"/>
  <path d="M1140 706 H1165" class="softline"/>

  <rect x="450" y="836" width="1110" height="236" rx="16" class="result"/>
  <text x="480" y="874" class="head">4 · Evidence and interpretation</text>
  <rect x="490" y="904" width="435" height="130" rx="12" class="panel"/>
  <text x="512" y="936" class="label">results/&lt;run-id&gt;/</text>
  <text x="512" y="964" class="body">raw JSONL / probe output · summaries · metadata</text>
  <text x="512" y="989" class="body">Network and negative-control runs keep their own folders</text>
  <text x="512" y="1014" class="body">Syscall runs keep matrix.jsonl and engine/profile metadata</text>
  <rect x="1000" y="904" width="510" height="130" rx="12" class="doc"/>
  <text x="1022" y="936" class="label">REPORT.md</text>
  <text x="1022" y="964" class="body">Summarizes results, limitations, and next evidence steps</text>
  <text x="1022" y="989" class="body">Results are observations, not proof of security superiority</text>
  <text x="1022" y="1014" class="body">Architecture.svg shows runtime boundaries and components</text>
  <path d="M770 524 V560 H710 V640" class="softline"/>
  <path d="M990 762 V820 H710 V894" class="line"/>
  <path d="M1340 762 V820 H1255 V894" class="line"/>
  <path d="M925 969 H990" class="line"/>
</svg>
